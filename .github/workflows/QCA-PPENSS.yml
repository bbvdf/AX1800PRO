name: QCA-PPENSS

# 独立构建线：openwrt-ppe-nss（上游 qca_edma/qca_ppe + nss-wifi-drv，无 ECM / 无 NSS qdisc）
# 主线 QCA-VIKINGYFY / QCA-LiBwrt 不受影响；删掉本文件与对应 Scripts/Config 即回退

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: '只生成并校验 .config，不编译'
        type: boolean
        default: false

permissions:
  contents: write

env:
  WRT_REPO: https://github.com/JuliusBairaktaris/openwrt-ppe-nss
  WRT_BRANCH: ppe-nss
  WRT_CONFIG: IPQ60XX-PPENSS
  WRT_THEME: argon
  WRT_NAME: NERCH_Plus
  WRT_SSID: NERCH_Plus
  WRT_WORD: '8765432101'
  WRT_IP: 192.168.10.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: Init build environment
        run: |
          sudo -E apt-get -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo timedatectl set-timezone "$TZ"

      - name: Initialization values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +%y.%m.%d-%H.%M)" >> $GITHUB_ENV

      - name: Clone ppe-nss
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" wrt
          cd wrt && echo "WRT_HASH=$(git log -1 --pretty=%h)" >> $GITHUB_ENV

      - name: Custom feeds and packages
        working-directory: wrt
        run: |
          find "$GITHUB_WORKSPACE/Scripts" -name '*.sh' -exec dos2unix {} \; -exec chmod +x {} \;
          bash "$GITHUB_WORKSPACE/Scripts/ppe-setup.sh"

      - name: Update feeds
        working-directory: wrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply configuration
        working-directory: wrt
        run: |
          bash "$GITHUB_WORKSPACE/Scripts/ppe-settings.sh"
          cp "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" .config
          make defconfig

      - name: Verify config symbols
        working-directory: wrt
        run: |
          miss=0
          for s in \
            CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01 \
            CONFIG_PACKAGE_kmod-nss-wifi-drv \
            CONFIG_PACKAGE_nss-firmware-ipq60xx \
            CONFIG_PACKAGE_ppe-qos \
            CONFIG_PACKAGE_luci-app-ppe-qos \
            CONFIG_PACKAGE_luci-app-daed \
            CONFIG_PACKAGE_luci-theme-argon; do
            if grep -q "^$s=y" .config; then
              echo "OK       $s"
            else
              echo "::warning title=dropped symbol::$s 未进入 .config"
              miss=$((miss+1))
            fi
          done
          echo "selected packages: $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"
          echo "kernel: $(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/qualcommax/Makefile 2>/dev/null)"
          echo "dropped: $miss"

      - name: Restore ccache
        if: ${{ !inputs.TEST }}
        uses: actions/cache@v4
        with:
          path: wrt/.ccache
          key: ppe-ccache-${{ env.WRT_HASH }}-${{ hashFiles('Config/IPQ60XX-PPENSS.txt') }}
          restore-keys: |
            ppe-ccache-${{ env.WRT_HASH }}-
            ppe-ccache-

      - name: Download packages
        if: ${{ !inputs.TEST }}
        working-directory: wrt
        run: make download -j$(nproc)

      - name: Compile
        if: ${{ !inputs.TEST }}
        working-directory: wrt
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          staging_dir/host/bin/ccache -z || true
          make -j$(nproc) || make -j1 V=s
          staging_dir/host/bin/ccache -s || true

      - name: Collect firmware
        if: ${{ !inputs.TEST }}
        working-directory: wrt
        run: |
          mkdir -p upload
          find bin/targets -maxdepth 3 -type f \( -name '*sysupgrade*' -o -name '*initramfs*' -o -name '*.manifest' \) \
            -exec cp -f {} upload/ \;
          cp -f .config "upload/Config-${WRT_CONFIG}-${WRT_HASH}.txt"
          ls -lh upload

      - name: Release
        if: ${{ !inputs.TEST }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: QCA-PPENSS-${{ env.WRT_DATE }}
          files: wrt/upload/*
          body: |
            京东云亚瑟 AX1800 Pro (jdcloud re-ss-01) · ppe-nss 栈

            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}
            配置：${{ env.WRT_CONFIG }}

            登录地址：${{ env.WRT_IP }}
            WIFI：${{ env.WRT_SSID }} / ${{ env.WRT_WORD }}
            镜像需先有可启动的 OpenWrt，再 sysupgrade；回滚用主线 QCA-VIKINGYFY 镜像。
